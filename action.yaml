name: 'Aqua Security Trivy installer'
description: 'Install Trivy binary from release page'
author: 'Aqua Security'

inputs:
  version:
    description: 'Trivy version to install'
    required: false
    default: 'latest'
  version-file:
    description: >
      Path to a file to read the Trivy version from. Supports the asdf
      '.tool-versions' layout (a line such as "trivy 0.71.0") and a plain
      version file (first non-empty, non-comment line). The version is used
      as-is, so include the leading "v" if the release tag has one (e.g.
      "trivy v0.71.0"). Takes precedence over 'version' when set.
    required: false
    default: ''
  path:
    description: >
      Path in runner to install Trivy. Trivy will be installed in "<path>/trivy-bin" dir
      ("$HOME/.local/bin/trivy-bin" by default).
      Must be a literal path: shell variables (e.g. $HOME, $RUNNER_TEMP) and "~" are NOT
      expanded. Use a GitHub expression that is resolved before the step runs, or a
      relative path like "./bins".
    required: false
    default: ''
  cache:
    description: 'Used to specify whether caching is needed. Set to false, if you would like to disable caching.'
    required: false
    default: 'false'
  token:
    description: >
      Access token used to check out the Trivy repository.
      The token is required when using GitHub Enterprise Server (GHES).
      https://github.com/actions/create-github-app-token can be used to obtain such a token.
      The token should be limited to read access only for public repositories.
      See more details in https://github.com/aquasecurity/setup-trivy/issues/10
    required: false
    ## ${{ github.token }} is default value for actions/checkout
    ## cf. https://github.com/actions/checkout/blob/eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871/action.yml#L24
    default: ${{ github.token }}
  github-server-url:
    description: The base URL for the GitHub instance to clone aquasecurity/trivy from. Defaults to public https://github.com
    required: false
    ## Note: we explicitly set the default to public rather than the current server api (in case of private GHES)
    ## but it can optionally be set to '${{ github.server_url }}' on GHES if the repository has been mirrored (e.g., via actions/actions-sync).
    ## Ref. https://github.com/aquasecurity/setup-trivy/issues/10 and https://github.com/aquasecurity/setup-trivy/pull/16
    default: 'https://github.com'

runs:
  using: 'composite'
  steps:
    - name: Binary dir
      id: binary-dir
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        # `path` is passed via env to avoid script injection. As a result, shell
        # variables (e.g. $HOME) and `~` inside it are NOT expanded. We validate it to:
        #   1. fail early with a clear message instead of silently creating a directory
        #      literally named `$HOME`;
        #   2. reject newlines, which could otherwise inject extra lines into the
        #      `$GITHUB_OUTPUT` file (and thus poison the `dir` output).
        case "${INPUT_PATH}" in
          *'$'* | *'~'*)
            echo "::error::The 'path' input must be a literal path. Shell variables (e.g. \$HOME, \$USER) and '~' are not expanded. Use a GitHub expression that is resolved before the step runs, a relative path, or leave 'path' empty to use the default (\$HOME/.local/bin)." >&2
            exit 1
            ;;
          *[$'\n\r']*)
            echo "::error::The 'path' input must not contain newline characters." >&2
            exit 1
            ;;
        esac
        # Default path. Keep `$HOME/.local/bin` in sync with the `path` input description above.
        echo "dir=${INPUT_PATH:-$HOME/.local/bin}/trivy-bin" >> "$GITHUB_OUTPUT"

    ## Resolve the effective Trivy version. A 'version-file', when set, takes
    ## precedence over the 'version' input. Inputs are passed via env (not
    ## interpolated into the script) to avoid injection, consistent with the
    ## 'path' handling above.
    - name: Resolve Trivy version
      id: resolve-version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERSION_FILE: ${{ inputs.version-file }}
      run: |
        version="${INPUT_VERSION}"
        if [ -n "${INPUT_VERSION_FILE}" ]; then
          if [ ! -f "${INPUT_VERSION_FILE}" ]; then
            echo "::error::The 'version-file' '${INPUT_VERSION_FILE}' does not exist." >&2
            exit 1
          fi
          # asdf '.tool-versions' format: a line such as "trivy 0.71.0".
          # '|| true' keeps a no-match grep (exit 1) from aborting the step,
          # since the default GitHub bash shell runs with '-e -o pipefail'.
          version=$(grep -E '^[[:space:]]*trivy[[:space:]]+' "${INPUT_VERSION_FILE}" | head -n 1 | tr -d '\r' | awk '{print $2}') || true
          # Otherwise treat the file as a plain version file (first token of the
          # first non-empty, non-comment line).
          if [ -z "${version}" ]; then
            version=$(grep -vE '^[[:space:]]*(#|$)' "${INPUT_VERSION_FILE}" | head -n 1 | tr -d '\r' | awk '{print $1}') || true
          fi
          if [ -z "${version}" ]; then
            echo "::error::No Trivy version found in 'version-file' '${INPUT_VERSION_FILE}'." >&2
            exit 1
          fi
          echo "Using Trivy version '${version}' from version-file '${INPUT_VERSION_FILE}'."
        fi
        # Reject newlines that could otherwise poison the $GITHUB_OUTPUT file,
        # consistent with the 'path' validation above.
        case "${version}" in
          *[$'\n\r']*)
            echo "::error::The resolved Trivy version must not contain newline characters." >&2
            exit 1
            ;;
        esac
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    ## Don't cache `latest` version
    - name: Check the version for caching
      if: ${{ inputs.cache == 'true' && steps.resolve-version.outputs.version == 'latest' }}
      shell: bash
      run: |
        echo "'setup-trivy' doesn't currently support caching the 'latest' version"
        echo "read https://github.com/aquasecurity/setup-trivy?tab=readme-ov-file#caching for more details"

    - name: Restore Trivy binary from cache
      if: ${{ inputs.cache == 'true' && steps.resolve-version.outputs.version != 'latest' }}
      id: cache
      uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ${{ steps.binary-dir.outputs.dir }}
        key: trivy-binary-${{ steps.resolve-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    ## Security: Pin to a specific commit hash (not tag) to prevent supply chain attacks.
    ## The install script is stable and can install different Trivy versions.
    ## Update this ref as needed after reviewing changes to contrib/install.sh
    - name: Checkout install script
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        repository: aquasecurity/trivy
        sparse-checkout: |
          contrib
        path: trivy
        fetch-depth: 1
        ref: 75c4dc0f45c5d7ffd05ae26df1e0c666787bdf2a # main (with -c flag support)
        github-server-url: ${{ inputs.github-server-url }}
        token: ${{ inputs.token }}

      ## Install Trivy using install script,
      ## Copy the `contrib` directory to the directory with the binary
      ## Remove the `trivy` directory produced by the checkout step, as it may cause errors in linters/checks in the calling code.
    - name: Install Trivy
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BINARY_DIR: ${{ steps.binary-dir.outputs.dir }}
        TRIVY_VERSION: ${{ steps.resolve-version.outputs.version }}
      run: |
        echo "installing Trivy binary"
        bash ./trivy/contrib/install.sh -b "${BINARY_DIR}" -c setup-trivy "${TRIVY_VERSION}"
        cp -r ./trivy/contrib "${BINARY_DIR}/contrib"
        rm -rf ./trivy

    ## Add the Trivy binary, retrieved from cache or installed by a script, to $GITHUB_PATH
    - name: Add Trivy binary to $GITHUB_PATH
      shell: bash
      env:
        BINARY_DIR: ${{ steps.binary-dir.outputs.dir }}
      run: echo "${BINARY_DIR}" >> "$GITHUB_PATH"

    ## If one of the steps after setup-trivy fails,
    ## we won't save the binary to the cache because the step after won't be run.
    ## So we need to save the binary right after installation.
    ## cf. https://github.com/aquasecurity/setup-trivy/issues/18
    - name: Save Trivy binary to cache
      if:  ${{ inputs.cache == 'true' && steps.resolve-version.outputs.version != 'latest' && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ${{ steps.binary-dir.outputs.dir }}
        key: trivy-binary-${{ steps.resolve-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
